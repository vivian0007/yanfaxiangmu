# ============================================================
# nginx 反向代理模板 —— 复制到 /etc/nginx/conf.d/vivian.conf
# 请把 example.com 换成你自己的域名，证书路径改成自己的
# ============================================================
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;   # HTTP 一律跳 HTTPS
}

server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;      # 转发到 gunicorn

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
